[project]
name = "avalon"
version = "0.1.0"
description = "五个 AI 玩家对局的阿瓦隆：非 AI 裁判状态机 + 5 个接入 API 的 chatbot 玩家"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
avalon = "avalon.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avalon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
